plugins {
    id "com.android.application"
}

android {
    namespace "com.local.obsphonecam"
    compileSdk 35

    defaultConfig {
        applicationId "com.local.obsphonecam"
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName "1.5"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
